name: ci
on:
  pull_request:
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm run check
      - run: pnpm run build
      - run: pnpm run test
  # The site is deployed from its own folder with its own lockfile (apps/hp/Dockerfile):
  # build that exact image, so a stale apps/hp/pnpm-lock.yaml fails here, not on the server.
  hp-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t hp-site-ci apps/hp
