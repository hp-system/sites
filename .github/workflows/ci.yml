name: ci
on:
  pull_request:
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm run check
      - run: pnpm run build
      - run: pnpm run test
