<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    ΤΟ ΣΗΜΑ ΜΟΝΟ — ΧΩΡΙΣ ΠΛΑΙΣΙΟ.
    Πριν υπήρχε <rect> που γέμιζε τον καμβά με #0E1214: στην καρτέλα φαινόταν
    σαν μαύρο κουτί ανάμεσα στα υπόλοιπα εικονίδια.

    Η σωστή λύση δεν είναι «λευκό πάντα» — σε ΦΩΤΕΙΝΗ καρτέλα το λευκό σήμα
    εξαφανίζεται. Το SVG favicon υποστηρίζει `prefers-color-scheme`:
      · φωτεινή καρτέλα → σκούρο σήμα σε διάφανο φόντο
      · σκοτεινή καρτέλα → ΛΕΥΚΟ σήμα σε διάφανο φόντο
    Πάντα ορατό, ποτέ κουτί.

    Κεντράρισμα: το σήμα είναι 55,797 × 51,743 (μετρημένο με getBBox), δηλαδή
    ελαφρώς πλατύτερο από τετράγωνο. Κλίμακα 0,84 αφήνει οπτικό περιθώριο ώστε
    να μη «γεμίζει» το εικονίδιο — στα 16px αυτό είναι η διαφορά ανάμεσα σε
    ευανάγνωστο σήμα και μουτζούρα.
      πλάτος = 55,797 × 0,84 = 46,87 → x = (64 − 46,87)/2 = 8,57
      ύψος   = 51,743 × 0,84 = 43,46 → y = (64 − 43,46)/2 = 10,27
  -->
  <style>
    .mark { fill: #0E1214; }
    @media (prefers-color-scheme: dark) { .mark { fill: #FFFFFF; } }
  </style>
  <g class="mark" transform="translate(8.57 10.27) scale(0.84)">
    <path fill-rule="evenodd" d="M16.819 11.101L20.612 14.895L5.36 30.1349V51.7429H0V27.908L16.819 11.101ZM24.339 18.744L28.132 22.5369L16.091 34.577V51.7429H10.731V32.3619L24.339 18.744Z"/>
    <path fill-rule="evenodd" d="M20.3218 7.587L16.5278 11.38L39.6908 34.58V51.743H45.0619V32.362L20.3218 7.587ZM55.7938 51.743H50.4229V30.135L44.5479 24.235V15.6H35.9088L24.1149 3.793L27.9078 0L38.1278 10.228H49.9109V22.022L55.7969 27.908L55.7938 51.743Z"/>
  </g>
</svg>
